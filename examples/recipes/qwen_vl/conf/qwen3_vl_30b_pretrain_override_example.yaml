# Example override file for Qwen3-VL

model:
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 8
  seq_length: 4096
  # Disable meta device to allow optim_grads_params with frozen parameters
  # Meta device causes FSDP parameter grouping conflicts when freezing parts of the model
  # init_model_with_meta_device: true
  use_cpu_initialization: true
  gradient_accumulation_fusion: false

  # recompute_granularity: "full"
  # recompute_method: "uniform"
  # recompute_num_layers: 1
  
  # Only finetune vision projection, freeze language and vision models
  freeze_language_model: false
  freeze_vision_model: false
  freeze_vision_projection: false

train:
  train_iters: 20
  global_batch_size: 32
  micro_batch_size: 1
  eval_iters: 5

optimizer:
  lr:  2e-5
  min_lr:  2e-6
  use_distributed_optimizer: true

# mixed_precision:
#   _target_: megatron.bridge.training.mixed_precision.MixedPrecisionConfig
#   bf16: true
#   params_dtype:
#     _target_: torch.bfloat16
#     _call_: false
#   pipeline_dtype:
#     _target_: torch.bfloat16
#     _call_: false
#   autocast_enabled: false
#   grad_reduce_in_fp32: true
#   fp8_recipe: null

scheduler:
  lr_warmup_iters: 10

checkpoint:
  # Directory to save to. If null, no checkpoint will be saved.
  save: /lustre/fsw/portfolios/coreai/users/xuwenc/code/qwen_vl/MCore/Qwen/Qwen3-VL-30B-MoE
  # load: /lustre/fsw/portfolios/coreai/users/xuwenc/code/qwen_vl/MCore/Qwen/Qwen3-VL-30B-MoE
  ckpt_format: "fsdp_dtensor"
  save_optim: false
  save_rng: false
  # load_optim: false
  # load_rng: false

dist:
  use_megatron_fsdp: true
  use_torch_fsdp2: false

logger:
  log_interval: 1
  # wandb_project: "xuwenc-qwen3-vl"
  # wandb_exp_name: "qwen3-vl-3b-active-30b-moe-pretrain-fsdp"

dataset:
  sequence_length: 4096

rng:
  seed: 42

ddp:
  grad_reduce_in_bf16: true
  use_distributed_optimizer: true
  data_parallel_sharding_strategy: "optim_grads_params"
  use_megatron_fsdp: true
