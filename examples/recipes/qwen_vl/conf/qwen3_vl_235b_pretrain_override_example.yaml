# Example override file for Qwen3-VL

model:
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 64
  seq_length: 4096
  
  # Use meta device for initialization to avoid OOM during model creation
  # This delays GPU memory allocation until after FSDP wrapping
  # init_model_with_meta_device: true
  use_cpu_initialization: true
  gradient_accumulation_fusion: false
  # Full recompute for memory optimization
  # recompute_granularity: "full"
  # recompute_method: "uniform"
  # recompute_num_layers: 1

  # Only finetune vision projection, freeze language and vision models
  freeze_language_model: true
  freeze_vision_model: true
  freeze_vision_projection: false

train:
  train_iters: 100
  global_batch_size: 1024
  micro_batch_size: 1
  eval_iters: 5

optimizer:
  lr: 0.00025
  min_lr: 0.000025
  use_distributed_optimizer: true

scheduler:
  lr_warmup_iters: 10

checkpoint:
  # Directory to save to. If null, no checkpoint will be saved.
  save: null
  # save: /lustre/fsw/portfolios/coreai/users/xuwenc/code/qwen_vl/MCore/Qwen/Qwen3-VL-30B-MoE
  # load: /lustre/fsw/portfolios/coreai/users/xuwenc/code/qwen_vl/MCore/Qwen/Qwen3-VL-30B-MoE
  ckpt_format: "fsdp_dtensor"
  # save_optim: false
  # save_rng: false
  # load_optim: false
  # load_rng: false

dist:
  use_megatron_fsdp: true
  use_torch_fsdp2: false

logger:
  log_interval: 1
  # wandb_project: "xuwenc-qwen3-vl"
  # wandb_exp_name: "qwen3-vl-8b-pretrain-fsdp"

dataset:
  sequence_length: 4096

rng:
  seed: 42

ddp:
  grad_reduce_in_bf16: true
  use_distributed_optimizer: true
  data_parallel_sharding_strategy: "optim_grads_params"
  use_megatron_fsdp: true
